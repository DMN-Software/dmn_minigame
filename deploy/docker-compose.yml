name: dmn-minigame

services:
  minigames-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 8090
      DB_PATH: /data/minigame.db
      IP_SALT: ${IP_SALT:?bitte in deploy/.env setzen}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?bitte in deploy/.env setzen}
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [edge]

  minigames-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - minigames-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [edge]

volumes:
  api-data:

networks:
  edge:
    name: minigame_edge
    external: true
