name: Pruefung

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Api
        working-directory: api
        run: |
          npm ci
          npx tsc --noEmit
